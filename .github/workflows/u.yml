name: Ubuntu SSH Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tmate & Start
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
          
          # 前台运行 tmate 10秒以便强制输出连接地址到日志
          tmate -k -F &
          sleep 10
