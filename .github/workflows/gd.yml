name: guding

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Environment
        run: |
          node -v
          npm -v

      - name: Build & Start Tunnel
        run: |

          # 2. 配置 Windows 远程桌面 (RDP)
          $USERNAME="Administrator"
          $PASSWORD="Yi1Yun2Pan3"
          
          $userExists = net user $USERNAME 2>$null
          
          if ($LASTEXITCODE -eq 0) {
              Write-Host "User exists, changing password..."
              net user $USERNAME $PASSWORD
          } else {
              Write-Host "User not found, creating user..."
              net user $USERNAME $PASSWORD /add /y
          }
          
          
          net user $USERNAME /active:yes
          net localgroup Administrators $USERNAME /add
          net localgroup "Remote Desktop Users" $USERNAME /add
          
          Set-Service TermService -StartupType Automatic
          Start-Service TermService
          
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          
          Test-NetConnection localhost -Port 3389
          net user $USERNAME

          # 1. 下载 Cloudflared
          curl -LO "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

